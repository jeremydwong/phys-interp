[project]
name = "phys-interp"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.15.0",
    "av>=19.0.1",
    "bitsandbytes>=0.50.2",
    "einops>=0.8.2",
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "mujoco>=3.16.0",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
    "qwen-vl-utils>=0.0.14",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.1",
]

# CUDA wheels for the Windows GPU worker (RTX 50-series / sm_120 needs CUDA >= 12.8).
# torch 2.14.1 is not published on cu128; cu132 is the newest index carrying it.
# macOS keeps resolving torch from PyPI.
[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]
